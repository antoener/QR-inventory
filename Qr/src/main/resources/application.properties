#project name
spring.application.name=inventarioQR

#load local .env (gitignored) for development; missing file is ok
spring.config.import=optional:file:.env[.properties]

#Database config
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP connection pool
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_SIZE:20}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

#jpa update for development
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.access-expiration-minutes=${JWT_ACCESS_EXPIRATION_MIN:15}
jwt.refresh-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:7}

#spring automatic documentation
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# CORS configuration
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}

# Jackson date/time configuration
spring.jackson.time-zone=UTC
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss


# Security configuration
app.security.inactivity-timeout-minutes=${INACTIVITY_TIMEOUT:15}
app.security.cookie-secure=${COOKIE_SECURE:true}

# Rate limiting - comma-separated list of trusted proxy IPs
app.security.trusted-proxies=${TRUSTED_PROXIES:}
app.security.rate-limit.login-attempts=${LOGIN_RATE_LIMIT:5}
app.security.rate-limit.login-window-seconds=${LOGIN_RATE_LIMIT_WINDOW:60}
app.security.rate-limit.forgot-attempts=${FORGOT_RATE_LIMIT:5}
app.security.rate-limit.forgot-window-seconds=${FORGOT_RATE_LIMIT_WINDOW:60}
app.security.rate-limit.global-attempts=${GLOBAL_RATE_LIMIT:200}
app.security.rate-limit.global-window-seconds=${GLOBAL_RATE_LIMIT_WINDOW:60}

# Bootstrap del admin inicial (solo si la tabla de usuarios esta vacia)
app.admin.username=${APP_ADMIN_USERNAME:admin}
app.admin.email=${APP_ADMIN_EMAIL:}
app.admin.password=${APP_ADMIN_PASSWORD:}

# Reverse proxy (Railway/Heroku)
server.forward-headers-strategy=framework

# Swagger configuration
app.swagger.enabled=${SWAGGER_ENABLED:false}

