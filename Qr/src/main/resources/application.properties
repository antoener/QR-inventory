#project name
spring.application.name=inventarioQR

#load local .env (gitignored) for development; missing file is ok
spring.config.import=optional:file:.env[.properties]

#Database config
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP connection pool
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_SIZE:20}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

#jpa update for development
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${EXPIRATIONS}

#spring automatic documentation
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# CORS configuration
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}

# Jackson date/time configuration
spring.jackson.time-zone=UTC
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss


# Security configuration
app.security.inactivity-timeout-minutes=${INACTIVITY_TIMEOUT:15}

# Rate limiting - comma-separated list of trusted proxy IPs
app.security.trusted-proxies=${TRUSTED_PROXIES:}

# Swagger configuration
app.swagger.enabled=${SWAGGER_ENABLED:false}

